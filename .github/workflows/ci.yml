name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: partflow_user
                    POSTGRES_PASSWORD: partflow_ci_password
                    POSTGRES_DB: partflow
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U partflow_user -d partflow"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql+psycopg://partflow_user:partflow_ci_password@localhost:5432/partflow
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                # Pin the same uv version selected by backend/Dockerfile.
            - name: Install uv
              run: pip install uv==0.8.22
            - name: Install dependencies
              run: uv sync --frozen
            - name: Format check
              run: uv run ruff format --check .
            - name: Lint
              run: uv run ruff check .
            - name: Type check
              run: uv run mypy app tests
            - name: Migrations
              run: uv run alembic upgrade head
            - name: Tests
              run: uv run pytest

    # Verifies that the development images assemble from the committed
    # lockfiles. The backend/frontend jobs already run the quality gates,
    # so this job only builds; it does not start the stack.
    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Build images
              run: docker compose build

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Format check
              run: npm run format:check
            - name: Lint
              run: npm run lint
            - name: Type check
              run: npm run typecheck
            - name: Tests
              run: npm run test
            - name: Build
              run: npm run build
