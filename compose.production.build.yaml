# Build-only companion of compose.production.yaml (DEPLOYMENT §3.1): it adds the image build
# of backend and web and is used for `build` only, with the candidate tag and its commit in the shell:
#   PARTFLOW_RELEASE=<new> PARTFLOW_COMMIT=$(git rev-parse HEAD) $PF -f compose.production.build.yaml build
# (deploy/production/release.sh runs exactly this). Both images carry the release identity: the build
# fails without a release tag or a full 40-character commit SHA, and an existing tag is never rebuilt.
# Never use it with `up` or `run`: compose.production.yaml has no build section, so starting a
# tag whose images are missing fails instead of building the checkout under that tag.
services:
    backend:
        build:
            context: ./backend
            target: production
            args:
                PARTFLOW_RELEASE: ${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE for the build}
                PARTFLOW_COMMIT: ${PARTFLOW_COMMIT:-}
    web:
        build:
            context: ./frontend
            target: production
            args:
                PARTFLOW_RELEASE: ${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE for the build}
                PARTFLOW_COMMIT: ${PARTFLOW_COMMIT:-}
