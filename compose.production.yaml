# PartFlow production stack (Phase 16 slices 2-4; DEPLOYMENT §3.1). Not for development:
# development uses compose.yaml. Run from the release checkout with
#   PF="docker compose -f compose.production.yaml --env-file .env.production"
# and never `$PF down -v` (it deletes the production database volume). Releases run through
# deploy/production/release.sh; the images carry their release identity (RELEASE_TAG/RELEASE_COMMIT), so this
# file never sets it.
name: partflow-production

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "5"

# Database connections in the file-based form (backend/app/core/config.py): each password is read from a
# secret file, never set in an environment value. The owner (POSTGRES_USER, a superuser) is used only by the
# one-shot migrate and db-roles; backend connects as the application database role partflow_app (P16-S4).
x-owner-database-environment: &owner-database-environment
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    SITE_TIMEZONE: ${PARTFLOW_SITE_TIMEZONE:?Set PARTFLOW_SITE_TIMEZONE in .env.production}

x-app-database-environment: &app-database-environment
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    # Fixed: equals app.application.database_roles.APP_ROLE (static test ST-10).
    DATABASE_USER: partflow_app
    DATABASE_PASSWORD_FILE: /run/secrets/partflow_app_password
    SITE_TIMEZONE: ${PARTFLOW_SITE_TIMEZONE:?Set PARTFLOW_SITE_TIMEZONE in .env.production}

services:
    db:
        # Debian variant pinned to the development minor: collation and the
        # reconcile check (j) depend on glibc, so never an -alpine image.
        image: postgres:16.14
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
            # Read only when a new data volume is initialized.
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        secrets: [postgres_password]
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks: [internal]
        shm_size: 256m
        stop_grace_period: 60s
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: ${PARTFLOW_DB_MEMORY:-1g}
                    cpus: "${PARTFLOW_DB_CPUS:-1.0}"
        logging: *logging

    backend:
        image: partflow/backend:${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE in .env.production}
        # Built locally from the checked-out release only (compose.production.build.yaml); never
        # pulled and never built here, so `up` or `run` with a missing tag fails instead of
        # building the current checkout under that tag.
        pull_policy: never
        environment:
            <<: *app-database-environment
            DATABASE_ROLES_REQUIRED: "true"
            SESSION_COOKIE_SECURE: "true"
            # Writes from a page of another release are refused (409); fixed on in production.
            ENFORCE_CLIENT_RELEASE: "true"
            # Rollback path 2 only (OPERATIONS_RUNBOOK §6): the one database revision this release may serve.
            ACCEPT_SCHEMA_REVISION: ${PARTFLOW_ACCEPT_SCHEMA_REVISION:-}
            WEB_CONCURRENCY: ${PARTFLOW_BACKEND_WORKERS:-2}
            FORWARDED_ALLOW_IPS: ${PARTFLOW_EDGE_SUBNET:-172.30.250.0/24}
        # Never postgres_password: backend does not hold the owner credential.
        secrets: [partflow_app_password]
        networks: [internal, edge]
        depends_on:
            db:
                condition: service_healthy
        # Above web's longest upstream timeout (180 s, POST /api/work-orders/import) so a stop or
        # recreate lets an in-flight import finish instead of killing the worker partway.
        stop_grace_period: 200s
        # Never on-failure: with more than one worker a configuration refusal exits 0.
        restart: unless-stopped
        healthcheck:
            # Liveness only (no database, no readiness): a schema mismatch never makes it unhealthy.
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).close()"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: ${PARTFLOW_BACKEND_MEMORY:-1g}
                    cpus: "${PARTFLOW_BACKEND_CPUS:-2.0}"
        logging: *logging

    web:
        image: partflow/web:${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE in .env.production}
        pull_policy: never
        # The only published port, on loopback only: the platform TLS proxy connects here.
        # There is deliberately no variable for the bind address.
        ports:
            - "127.0.0.1:${PARTFLOW_HTTP_PORT:?Set PARTFLOW_HTTP_PORT in .env.production}:80"
        environment:
            # Empty = auto-detect the edge gateway (DEPLOYMENT §3.1); set only when a host check (P16-S7) requires it.
            PARTFLOW_TRUSTED_PROXY: ${PARTFLOW_TRUSTED_PROXY:-}
        networks: [edge]
        # No depends_on: nginx resolves backend per request, so web keeps serving the
        # shell while backend is stopped and follows a recreated backend.
        # nginx stops gracefully (SIGQUIT) and waits for in-flight requests, including a 180 s import.
        stop_grace_period: 200s
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/web-health"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: ${PARTFLOW_WEB_MEMORY:-128m}
                    cpus: "${PARTFLOW_WEB_CPUS:-0.5}"
        logging: *logging

    # One-shot migration job: never started by `up`; run once per release (release.sh does) with
    # `PARTFLOW_RELEASE=<new> $PF --profile ops run --rm -T migrate (--pre-release-backup REF | --no-backup-reason TEXT)`.
    # One connection, one transaction; it refuses while backend is connected. No command: without a backup
    # option it is a usage error (exit 2).
    migrate:
        image: partflow/backend:${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE in .env.production}
        pull_policy: never
        profiles: [ops]
        entrypoint: ["python", "-m", "app.cli", "migrate"]
        environment:
            <<: *owner-database-environment
            # Refuses (roles_not_provisioned) instead of migrating without grants; every migrate applies them.
            DATABASE_ROLES_REQUIRED: "true"
        secrets: [postgres_password]
        networks: [internal]
        depends_on:
            db:
                condition: service_healthy
        restart: "no"
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    memory: ${PARTFLOW_OPS_MEMORY:-512m}
                    cpus: "${PARTFLOW_OPS_CPUS:-1.0}"
        logging: *logging

    # One-shot database-role job (P16-S4): `$PF --profile ops run --rm -T db-roles` creates or repairs the database
    # roles partflow_app and partflow_maintenance and sets their passwords from the secret files (safe to repeat);
    # `$PF --profile ops run --rm -T db-roles apply-grants` re-applies the grants outside a migrate (after a restore).
    # A role password is rotated in a short write freeze: replace the file, `$PF stop backend`, db-roles,
    # `$PF up -d --force-recreate --no-deps backend` (OPERATIONS_RUNBOOK §9).
    db-roles:
        image: partflow/backend:${PARTFLOW_RELEASE:?Set PARTFLOW_RELEASE in .env.production}
        pull_policy: never
        profiles: [ops]
        entrypoint: ["python", "-m", "app.cli"]
        command: ["provision-roles"]
        environment:
            <<: *owner-database-environment
        secrets: [postgres_password, partflow_app_password, partflow_maintenance_password]
        networks: [internal]
        depends_on:
            db:
                condition: service_healthy
        restart: "no"
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    memory: ${PARTFLOW_OPS_MEMORY:-512m}
                    cpus: "${PARTFLOW_OPS_CPUS:-1.0}"
        logging: *logging

networks:
    internal:
        internal: true
    edge:
        ipam:
            config:
                - subnet: ${PARTFLOW_EDGE_SUBNET:-172.30.250.0/24}

volumes:
    postgres_data:

# Create every file before the first command that starts backend or an ops service: Compose replaces a missing
# file by an empty directory (release.sh refuses until each one is a regular, non-empty file).
secrets:
    postgres_password:
        file: ${PARTFLOW_SECRETS_DIR:?Set PARTFLOW_SECRETS_DIR in .env.production}/postgres_password
    partflow_app_password:
        file: ${PARTFLOW_SECRETS_DIR:?Set PARTFLOW_SECRETS_DIR in .env.production}/partflow_app_password
    partflow_maintenance_password:
        file: ${PARTFLOW_SECRETS_DIR:?Set PARTFLOW_SECRETS_DIR in .env.production}/partflow_maintenance_password
