# P16-S6 observability rehearsal OR-7 only (deploy/production/tests/observability_rehearsal.py): a throwaway
# nginx:1.30.5-alpine container serving TLS with a generated self-signed certificate, so that check.sh's certificate
# check reads a real certificate. Never used by the production web tier (frontend/nginx/).
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/or7/certificate.pem;
    ssl_certificate_key /etc/nginx/or7/key.pem;
    location / {
        return 200 "or-7\n";
    }
}
